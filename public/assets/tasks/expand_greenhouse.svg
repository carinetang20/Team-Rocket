<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="eg-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#86efac" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eg-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="eg-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="eg-plant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="eg-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="112" fill="url(#eg-glow)"/>
  <!-- house shadow -->
  <path d="M40 188V120l88-56 88 56v68z" fill="#061428" opacity=".3" transform="translate(4 4)"/>
  <!-- greenhouse body -->
  <path d="M36 184V116l92-60 92 60v68z" fill="url(#eg-glass)" stroke="#0369a1" stroke-width="3"/>
  <!-- frame -->
  <g stroke="url(#eg-frame)" stroke-width="5" stroke-linejoin="round">
    <path d="M36 116l92-60 92 60"/>
    <line x1="128" y1="56" x2="128" y2="184"/>
    <line x1="36" y1="116" x2="36" y2="184"/>
    <line x1="220" y1="116" x2="220" y2="184"/>
    <line x1="36" y1="184" x2="220" y2="184"/>
    <line x1="36" y1="150" x2="220" y2="150"/>
  </g>
  <!-- plants inside -->
  <g filter="url(#eg-soft)">
    <ellipse cx="80" cy="168" rx="18" ry="12" fill="url(#eg-plant)"/>
    <ellipse cx="128" cy="160" rx="22" ry="16" fill="url(#eg-plant)"/>
    <ellipse cx="176" cy="168" rx="18" ry="12" fill="url(#eg-plant)"/>
    <path d="M128 160c-4-28 0-48 0-48s16 18 14 48" fill="#4ade80"/>
    <path d="M80 168c-2-20 4-32 4-32s10 12 8 32" fill="#4ade80"/>
    <path d="M176 168c2-20-4-32-4-32s-10 12-8 32" fill="#4ade80"/>
  </g>
  <!-- expand arrows -->
  <g filter="url(#eg-soft)" fill="#39ff14" stroke="#1a7a0a" stroke-width="2">
    <path d="M28 100l-16 14h10v20h12v-20h10z"/>
    <path d="M228 100l16 14h-10v20h-12v-20h-10z"/>
  </g>
</svg>
