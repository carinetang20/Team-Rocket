<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="sp-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffe566" stop-opacity=".4"/>
      <stop offset="55%" stop-color="#2a6fd4" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="45%" stop-color="#ffe033"/>
      <stop offset="100%" stop-color="#f0a000"/>
    </linearGradient>
    <linearGradient id="sp-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a9ae8"/>
      <stop offset="50%" stop-color="#1e4ea0"/>
      <stop offset="100%" stop-color="#0d2f66"/>
    </linearGradient>
    <filter id="sp-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="112" fill="url(#sp-glow)"/>
  <!-- sun -->
  <g filter="url(#sp-soft)">
    <circle cx="128" cy="58" r="28" fill="url(#sp-sun)" stroke="#c98400" stroke-width="2.5"/>
    <g stroke="#ffe033" stroke-width="5" stroke-linecap="round">
      <line x1="128" y1="14" x2="128" y2="26"/>
      <line x1="128" y1="90" x2="128" y2="102"/>
      <line x1="84" y1="58" x2="96" y2="58"/>
      <line x1="160" y1="58" x2="172" y2="58"/>
      <line x1="97" y1="27" x2="105" y2="35"/>
      <line x1="151" y1="81" x2="159" y2="89"/>
      <line x1="97" y1="89" x2="105" y2="81"/>
      <line x1="151" y1="35" x2="159" y2="27"/>
    </g>
    <circle cx="118" cy="50" r="7" fill="#fff" opacity=".45"/>
  </g>
  <!-- panel stand -->
  <rect x="118" y="168" width="20" height="40" rx="3" fill="#4b5563"/>
  <rect x="96" y="204" width="64" height="12" rx="4" fill="#374151"/>
  <!-- solar panel (angled) -->
  <g transform="translate(128 160)">
    <path d="M-90 -8 L90 -8 L72 48 L-72 48 Z" fill="#1a2744" stroke="#0d1a30" stroke-width="3"/>
    <path d="M-82 -2 L82 -2 L66 42 L-66 42 Z" fill="url(#sp-panel)"/>
    <!-- grid -->
    <g stroke="#9ec8ff" stroke-width="2" opacity=".55">
      <line x1="-28" y1="-2" x2="-22" y2="42"/>
      <line x1="0" y1="-2" x2="0" y2="42"/>
      <line x1="28" y1="-2" x2="22" y2="42"/>
      <line x1="-82" y1="12" x2="82" y2="12"/>
      <line x1="-74" y1="28" x2="74" y2="28"/>
    </g>
    <path d="M-70 4 L-40 4 L-36 14 L-66 14 Z" fill="#fff" opacity=".2"/>
  </g>
</svg>
