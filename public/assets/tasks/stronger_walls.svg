<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="sw-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c4a484" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sw-brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a078"/>
      <stop offset="50%" stop-color="#c45c2a"/>
      <stop offset="100%" stop-color="#8a3418"/>
    </linearGradient>
    <linearGradient id="sw-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaed"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <filter id="sw-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="112" fill="url(#sw-glow)"/>
  <!-- wall shadow -->
  <rect x="52" y="70" width="152" height="128" rx="8" fill="#061428" opacity=".3" transform="translate(4 6)"/>
  <!-- brick wall -->
  <rect x="48" y="64" width="160" height="136" rx="8" fill="url(#sw-brick)" stroke="#6b2a10" stroke-width="3"/>
  <!-- mortar lines -->
  <g stroke="#f0d0b8" stroke-width="3" opacity=".55">
    <line x1="48" y1="98" x2="208" y2="98"/>
    <line x1="48" y1="132" x2="208" y2="132"/>
    <line x1="48" y1="166" x2="208" y2="166"/>
    <line x1="128" y1="64" x2="128" y2="98"/>
    <line x1="88" y1="98" x2="88" y2="132"/>
    <line x1="168" y1="98" x2="168" y2="132"/>
    <line x1="128" y1="132" x2="128" y2="166"/>
    <line x1="88" y1="166" x2="88" y2="200"/>
    <line x1="168" y1="166" x2="168" y2="200"/>
  </g>
  <!-- steel brace -->
  <g filter="url(#sw-soft)">
    <rect x="68" y="108" width="120" height="18" rx="3" fill="url(#sw-steel)" stroke="#374151" stroke-width="2"/>
    <circle cx="84" cy="117" r="5" fill="#1f2937"/>
    <circle cx="172" cy="117" r="5" fill="#1f2937"/>
    <rect x="68" y="148" width="120" height="18" rx="3" fill="url(#sw-steel)" stroke="#374151" stroke-width="2"/>
    <circle cx="84" cy="157" r="5" fill="#1f2937"/>
    <circle cx="172" cy="157" r="5" fill="#1f2937"/>
  </g>
  <!-- strength badge -->
  <g filter="url(#sw-soft)" transform="translate(176 40)">
    <circle cx="24" cy="24" r="26" fill="#1a3a20" stroke="#39ff14" stroke-width="3"/>
    <path d="M24 10l12 6v10c0 8-5 14-12 17-7-3-12-9-12-17V16z" fill="#7dff9a" stroke="#1a7a0a" stroke-width="2"/>
  </g>
</svg>
