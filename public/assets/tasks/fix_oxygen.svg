<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="fo-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6ad0f2" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fo-tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ae0f8"/>
      <stop offset="40%" stop-color="#2aa6d8"/>
      <stop offset="100%" stop-color="#0f5f86"/>
    </linearGradient>
    <linearGradient id="fo-wrench" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#c0c4c8"/>
      <stop offset="100%" stop-color="#7a8088"/>
    </linearGradient>
    <filter id="fo-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="112" fill="url(#fo-glow)"/>
  <!-- tank shadow -->
  <rect x="78" y="70" width="88" height="140" rx="36" fill="#061428" opacity=".3" transform="translate(4 6)"/>
  <!-- valve -->
  <rect x="114" y="42" width="16" height="22" rx="4" fill="#4b5563"/>
  <rect x="128" y="46" width="28" height="12" rx="5" fill="#6b7280"/>
  <circle cx="158" cy="52" r="8" fill="#9ca3af"/>
  <rect x="104" y="60" width="36" height="14" rx="4" fill="#374151"/>
  <!-- tank body -->
  <rect x="74" y="68" width="96" height="144" rx="40" fill="url(#fo-tank)" stroke="#0a4a6a" stroke-width="3"/>
  <rect x="78" y="100" width="88" height="6" fill="#0a4a6a" opacity=".35"/>
  <rect x="78" y="168" width="88" height="6" fill="#0a4a6a" opacity=".35"/>
  <rect x="86" y="82" width="16" height="110" rx="8" fill="#e8f9ff" opacity=".3"/>
  <!-- O2 -->
  <ellipse cx="114" cy="138" rx="22" ry="26" fill="none" stroke="#fff" stroke-width="7"/>
  <text x="138" y="158" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#fff">2</text>
  <!-- wrench badge -->
  <g filter="url(#fo-soft)" transform="translate(168 168)">
    <circle cx="28" cy="28" r="30" fill="#1a3a20" stroke="#39ff14" stroke-width="3"/>
    <path d="M18 22c0-8 6-14 14-14 4 0 7 1 9 3l-8 8 6 6 8-8c2 2 3 5 3 9 0 8-6 14-14 14-3 0-6-1-8-3l-12 12-8-8 12-12c-1-2-2-4-2-7z"
          fill="url(#fo-wrench)" stroke="#555" stroke-width="1.5"/>
  </g>
</svg>
