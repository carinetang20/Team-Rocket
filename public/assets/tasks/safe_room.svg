<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="sr-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sr-bunker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="40%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="sr-door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="sr-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="sr-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="112" fill="url(#sr-glow)"/>
  <!-- bunker building -->
  <path d="M48 196V100l80-48 80 48v96z" fill="#061428" opacity=".3" transform="translate(4 4)"/>
  <path d="M44 192V96l84-52 84 52v96z" fill="url(#sr-bunker)" stroke="#111827" stroke-width="3"/>
  <!-- roof edge -->
  <path d="M40 100l88-54 88 54-12 8-76-46-76 46z" fill="#6b7280" stroke="#374151" stroke-width="2"/>
  <!-- door -->
  <rect x="100" y="128" width="56" height="64" rx="6" fill="url(#sr-door)" stroke="#0f172a" stroke-width="2"/>
  <circle cx="144" cy="160" r="5" fill="#fbbf24"/>
  <!-- radiation / safe shield emblem -->
  <g filter="url(#sr-soft)">
    <path d="M128 52l36 14v22c0 18-12 30-36 38-24-8-36-20-36-38V66z"
          fill="url(#sr-shield)" stroke="#2e1065" stroke-width="2.5"/>
    <path d="M128 72v28M114 86h28" stroke="#ede9fe" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- warning triangles small -->
  <g fill="#fbbf24" opacity=".85">
    <path d="M64 168l12 22H52z"/>
    <path d="M192 168l12 22h-24z"/>
  </g>
</svg>
