<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="us-glow" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#7dff9a" stop-opacity=".35"/>
      <stop offset="45%" stop-color="#4aa0ff" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="us-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4efff"/>
      <stop offset="25%" stop-color="#6bb0f5"/>
      <stop offset="70%" stop-color="#2a68d0"/>
      <stop offset="100%" stop-color="#123e82"/>
    </linearGradient>
    <linearGradient id="us-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2fff4"/>
      <stop offset="35%" stop-color="#7dff9a"/>
      <stop offset="100%" stop-color="#1a6a3a"/>
    </linearGradient>
    <linearGradient id="us-arrow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a9a40"/>
      <stop offset="40%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#c8ffb0"/>
    </linearGradient>
    <filter id="us-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- soft backdrop -->
  <circle cx="128" cy="128" r="112" fill="url(#us-glow)"/>

  <!-- sparkles -->
  <g fill="#7dff9a" filter="url(#us-soft)">
    <path d="M42 108l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path d="M214 100l3.5 8 8 3.5-8 3.5-3.5 8-3.5-8-8-3.5 8-3.5z"/>
    <path d="M204 178l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <circle cx="52" cy="176" r="3.5" fill="#c8ffb0"/>
    <circle cx="128" cy="26" r="3" fill="#fff"/>
  </g>

  <!-- drop shadow -->
  <path d="M128 44L196 70v52c0 44-28 76-68 94-40-18-68-50-68-94V70L128 44z"
        fill="#061428" opacity=".35" transform="translate(0 6)"/>

  <!-- green metallic outer rim (upgraded look) -->
  <path d="M128 40L198 68v54c0 46-30 80-70 98-40-18-70-52-70-98V68L128 40z"
        fill="url(#us-rim)" stroke="#0d3a20" stroke-width="3"/>

  <!-- blue inner face -->
  <path d="M128 54L182 76v42c0 36-22 64-54 80-32-16-54-44-54-80V76L128 54z"
        fill="url(#us-body)"/>

  <!-- glass highlight -->
  <path d="M128 62L160 76v26c0 8-2 14-5 20L120 86V72L128 62z"
        fill="#ffffff" opacity=".3"/>

  <!-- inner plate -->
  <path d="M128 78L156 92v28c0 18-12 32-28 40-16-8-28-22-28-40V92L128 78z"
        fill="#0d2f66" opacity=".28"/>

  <!-- double chevron upgrade mark -->
  <g filter="url(#us-soft)">
    <path d="M96 128l32-28 32 28-12 12-20-18-20 18z"
          fill="url(#us-arrow)" stroke="#0d5a22" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M102 148l26-22 26 22-10 10-16-14-16 14z"
          fill="url(#us-arrow)" stroke="#0d5a22" stroke-width="2.5" stroke-linejoin="round" opacity=".9"/>
    <path d="M112 114l16-14 16 14" fill="none" stroke="#f2fff4" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- tiny level stars -->
  <g fill="#ffe566" filter="url(#us-soft)">
    <path d="M128 168l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  </g>
</svg>
